name: Build InvokeAI Docker Images

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or commit of the source repo to build'
        default: 'main'
        required: true
      variants:
        description: 'Comma-separated variants to build (cuda,cpu,rocm)'
        default: 'cuda,cpu,rocm'
        required: true
  schedule:
    # Daily build of main at 05:00 UTC – remove if you don't want this
    - cron: '0 5 * * *'

env:
  SOURCE_REPO: Pfannkuchensack/InvokeAI
  IMAGE_NAME: invokeai

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      variants: ${{ steps.parse.outputs.variants }}
      owner_lc: ${{ steps.parse.outputs.owner_lc }}
      ref: ${{ steps.parse.outputs.ref }}
    steps:
      - id: parse
        run: |
          variants_input='${{ inputs.variants || ''cuda,cpu,rocm'' }}'
          variants_json=$(echo "$variants_input" | jq -Rc 'split(",") | map(gsub("^\\s+|\\s+$";""))')
          echo "variants=$variants_json" >> "$GITHUB_OUTPUT"
          echo "owner_lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "ref=${{ inputs.ref || 'main' }}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJson(needs.prepare.outputs.variants) }}
    steps:
      - name: Resolve build config
        id: cfg
        run: |
          case "${{ matrix.variant }}" in
            cuda)
              echo "dockerfile=docker/Dockerfile"          >> "$GITHUB_OUTPUT"
              echo "build_args=GPU_DRIVER=cuda"            >> "$GITHUB_OUTPUT"
              ;;
            cpu)
              echo "dockerfile=docker/Dockerfile"          >> "$GITHUB_OUTPUT"
              echo "build_args=GPU_DRIVER=cpu"             >> "$GITHUB_OUTPUT"
              ;;
            rocm)
              echo "dockerfile=docker/Dockerfile-rocm-full" >> "$GITHUB_OUTPUT"
              echo "build_args="                            >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unknown variant: ${{ matrix.variant }}" >&2
              exit 1
              ;;
          esac

      - name: Sanitize ref for tag
        id: tag
        run: |
          ref='${{ needs.prepare.outputs.ref }}'
          echo "ref_safe=$(echo "$ref" | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Checkout InvokeAI source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Free up disk space
        # The InvokeAI image is large; default runners run out of disk otherwise.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.cfg.outputs.dockerfile }}
          push: true
          build-args: ${{ steps.cfg.outputs.build_args }}
          tags: |
            ghcr.io/${{ needs.prepare.outputs.owner_lc }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.ref_safe }}-${{ matrix.variant }}
            ghcr.io/${{ needs.prepare.outputs.owner_lc }}/${{ env.IMAGE_NAME }}:latest-${{ matrix.variant }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
